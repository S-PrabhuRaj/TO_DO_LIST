
<!DOCTYPE html>
<html>
<head>
    <title>My To Do List</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        .container {
            background: white;
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 90%;
        }

        button {
            padding: 10px;
            margin: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        li {
            padding: 10px;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My To Do List</h1>

        <input type="text" id="task"
        placeholder="Enter your task">

        <button onclick="addTask()">Add Task</button>

        <ul id="taskList"></ul>

    </div>

    <script>
        function addTask() {

            var task = document.getElementById("task").value;

            if (task == "") {
                alert("Please enter a task");
            }
            else {
                var li = document.createElement("li");

                li.innerHTML = task;

                document.getElementById("taskList").appendChild(li);

                document.getElementById("task").value = "";
            }
        }
    </script>

</body>
</html>
